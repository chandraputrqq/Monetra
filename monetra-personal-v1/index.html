  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060a08" />
    <script>(function(){try{var m=localStorage.getItem('monetra-theme')||'dark';var h=new Date().getHours();var t=m==='auto'?((h>=6&&h<18)?'light':'dark'):m;document.documentElement.setAttribute('data-theme',t=='light'?'light':'dark');var c=document.querySelector('meta[name=theme-color]');if(c)c.setAttribute('content',t=='light'?'#f2f6f3':'#060a08')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
    <meta name="description" content="MONETRA — Know your money. Control your future." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
